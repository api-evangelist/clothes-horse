name: Clothes Horse
description: Clothes Horse was a New York-based, data-driven size-and-fit recommendation
  company for online apparel shopping. It matched a shopper's body measurements and
  brand preferences against retailers' actual garment measurements to recommend the
  right size at the point of sale, sold to retailers as SaaS. The company merged with
  Fits.me in December 2014 to form a virtual-fitting-room solutions provider, and no
  longer operates as an independent entity. It exposed no public API, developer portal,
  or documentation, and the clotheshor.se domain now resolves to an unrelated Swedish
  fashion/lifestyle WordPress blog. Surfaced as a 500 Global portfolio lead; enrichment
  found no live API surface.
